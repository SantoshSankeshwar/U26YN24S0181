<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BLDEA College</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 60px 20px;
        }

        /* Card Container */
        .content-card {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            padding: 45px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
            border-top: 5px solid #0056b3; /* Matching professional blue accent */
        }

        /* Navigation Links */
        .nav-links {
            margin-bottom: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #555555;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0 15px;
            transition: color 0.2s ease, border-bottom 0.2s ease;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
        }

        /* Main Heading / Address */
        .college-address {
            color: #0056b3;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.4;
            max-width: 750px;
            margin: 0 auto 35px auto;
        }

        /* Contact Info Blocks Container */
        .contact-info-container {
            max-width: 500px;
            margin: 0 auto 35px auto;
            text-align: left;
        }

        /* Styling each contact entry */
        .contact-item {
            font-size: 1.1rem;
            color: #4a5568;
            padding: 15px 20px;
            margin-bottom: 12px;
            background-color: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #cbd5e1;
            transition: border-left-color 0.2s ease, background-color 0.2s ease;
        }

        .contact-item:hover {
            background-color: #edf2f7;
            border-left-color: #0056b3;
        }

        .contact-label {
            font-weight: 700;
            color: #1a202c;
            display: inline-block;
            width: 90px;
        }

        /* Email emphasis styling */
        .contact-email {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }
        
        .contact-email:hover {
            text-decoration: underline;
        }

        /* --- New Form Styles --- */
        .divider {
            height: 1px;
            background-color: #e2e8f0;
            max-width: 500px;
            margin: 0 auto 35px auto;
        }

        .student-form-container {
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
        }

        .student-form-container h2 {
            color: #1a202c;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: #333333;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0056b3;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #0056b3;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #004085;
        }

        .success-message {
            margin-top: 20px;
            padding: 12px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="content-card">
        <!-- Navigation Bar -->
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="/course">Course details</a>
        </nav>

        <!-- College Full Address Heading -->
        <h1 class="college-address">
            BLDEA's Commerce, BHS Arts & TGP Science College, Jamkhandi - 587301 <br>
            <span style="font-size: 1.2rem; font-weight: 500; color: #4a5568;">Dist: Bagalkot, Karnataka State</span>
        </h1>
        
        <!-- Contact Information Block -->
        <div class="contact-info-container">
            <div class="contact-item">
                <span class="contact-label">Office:</span> 08353–220003
            </div>
            <div class="contact-item">
                <span class="contact-label">Principal:</span> 220183
            </div>
            <div class="contact-item">
                <span class="contact-label">Email:</span> 
                <a href="mailto:bldeajkd@yahoo.in" class="contact-email">bldeajkd@yahoo.in</a>
            </div>
        </div>

        <!-- Section Divider -->
        <div class="divider"></div>

        <!-- Student Form Block -->
        <div class="student-form-container">
            <h2>Student Query Registration</h2>
            
            <form id="studentContactForm" onsubmit="handleFormSubmit(event)">
                <div class="input-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter full name" required>
                </div>

                <div class="input-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="tel" id="contactNumber" placeholder="Enter phone number" required>
                </div>

                <button type="submit" class="submit-btn">Submit Details</button>
            </form>

            <!-- Success Notification -->
            <div id="statusMessage" class="success-message">
                Data saved successfully
            </div>
        </div>
    </div>

    <script>
        function handleFormSubmit(event) {
            // Stops page refresh
            event.preventDefault(); 
            
            // Displays success message block
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.style.display = 'block';
            
            // Clears form text fields
            document.getElementById('studentContactForm').reset();
            
            // Optional: Automatically hide the success message after 4 seconds
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 4000);
        }
    </script>

</body>
</html>
