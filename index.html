<!DOCTYPE html>
<html lang="en">
<head>
    <title>BLDEA College Jamkhandi</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 60px 20px;
        }

        /* Card Container */
        .college-card {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            padding: 45px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
            border-top: 5px solid #0056b3; /* Professional blue accent top border */
        }

        /* Navigation Links */
        .nav-links {
            margin-bottom: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #555555;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0 15px;
            transition: color 0.2s ease, border-bottom 0.2s ease;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
        }

        /* Main Heading */
        .college-title {
            color: #0056b3;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        /* Year Highlight */
        .college-year {
            font-size: 1.1rem;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 10px;
        }

        /* Location Tag */
        .college-location {
            font-size: 0.95rem;
            color: #718096;
            text-transform: capitalize;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Location icon element */
        .college-location::before {
            content: "📍";
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="college-card">
        <!-- Navigation Bar -->
        <nav class="nav-links">
            <a href="/about">About Us</a>
            <a href="/course">Course details</a>
            <a href="/contact">Contact us</a>
        </nav>

        <!-- Main Content Section -->
        <h1 class="college-title">BLDEA college Jamkhandi</h1>
        <p class="college-year">Started year : 1963</p>
        <p class="college-location">Located at jamkhandi</p>
    </div>

</body>
</html>
